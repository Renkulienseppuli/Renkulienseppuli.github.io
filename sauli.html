<style>
img:hover {
  animation: shake 0.1s;
  animation-iteration-count: infinite;
}



@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(-100deg); }
  10% { transform: translate(-3px, -4px) rotate(20deg); }
  20% { transform: translate(-5px, 2px) rotate(40deg); }
  30% { transform: translate(5px, 4px) rotate(60deg); }
  40% { transform: translate(3px, -3px) rotate(80deg); }
  50% { transform: translate(-3px, 4px) rotate(100deg); }
  60% { transform: translate(-5px, 3px) rotate(120deg); }
  70% { transform: translate(5px, 3px) rotate(140deg); }
  80% { transform: translate(-3px, -3px) rotate(1600deg); }
  90% { transform: translate(1px, 2px) rotate(180deg); }
  100% { transform: translate(1px, -2px) rotate(200deg); }

}
</style>
